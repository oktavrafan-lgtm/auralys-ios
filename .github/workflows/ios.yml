
name: Auralys iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Auralys for iPhone
        run: |
          xcodebuild \
            -project Auralys.xcodeproj \
            -scheme Auralys \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Auralys.app Payload/
          zip -r Auralys.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Auralys-IPA
          path: Auralys.ipa
