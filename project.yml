
name: Auralys

options:
  bundleIdPrefix: com.auralys
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Auralys:
    type: application
    platform: iOS

    sources:
      - path: Auralys

    info:
      properties:
        UIBackgroundModes:
          - audio

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralys.music
        PRODUCT_NAME: Auralys
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
